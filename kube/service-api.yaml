apiVersion: v1
kind: Service
metadata:
  name: face-tracking-api
  labels:
    app: face-tracking-api
spec:
  selector:
    app: face-tracking-api
  ports:
    - protocol: TCP
      port: 8080       # Port exposed by the Service
      targetPort: 8080 # Port on the container
  type: ClusterIP # Use LoadBalancer or NodePort for external access