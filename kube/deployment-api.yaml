apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-tracking-api
  labels:
    app: face-tracking-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: face-tracking-api
  template:
    metadata:
      labels:
        app: face-tracking-api
    spec:
      containers:
        - name: face-tracking-api
          image:  nenos_face_tracking_repo-api:latest
          imagePullPolicy: Never # Use "Never" for local images
          # command: ["sh", "-c", "your-start-command-here"]
          command: ["python3", "/app/src/api/main.py"]
          resources:
            requests:
              memory: "128Mi" # Minimum memory required
              cpu: "250m"     # Minimum CPU required
            limits:
              memory: "512Mi" # Maximum memory allowed
              cpu: "500m"     
          ports:
            - containerPort: 8080
          env:
          - name: SQL_USER
            value: "root"
          - name: SQL_PASSWORD
            value: "adolf"